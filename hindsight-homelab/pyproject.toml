[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-homelab"
version = "0.1.0"
description = "Multi-tenant static-key tenant extension for Hindsight"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dev-only: needed to run this package's own tests. NOT installed at image
# build time (installs use `--no-deps`) and NOT a runtime dependency of the
# extension itself.
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
packages = ["hindsight_homelab"]

[tool.pytest.ini_options]
# Auto mode: every `async def test_*` runs as a coroutine without needing an
# explicit @pytest.mark.asyncio marker (the brief's own test file relies on
# the marker directly too, so either mode collects them — auto also removes
# the failure mode where a machine without pytest-asyncio silently skips/
# errors on only the async tests, leaving the sync ones looking green).
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Tests are formatted (via `ruff format`) but excluded from lint rules, which
# are too noisy for test code (unused imports/vars, import ordering).
exclude = [
    "tests/**",
]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top of file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
[tool.ty.environment]
python-version = "3.11"

# uv-specific dev tooling group, mirroring hindsight-api-slim/hindsight-embed.
# hindsight-homelab is deliberately NOT listed in the root pyproject.toml's
# [tool.uv.workspace] members (that file is upstream-owned and must not be
# edited), so this package resolves as its own standalone uv project with
# its own uv.lock, and `uv run --frozen` in scripts/hooks/lint.sh runs
# against that lock rather than the workspace one.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
    "ty>=0.0.1",
    # Dev/type-check only, resolved by path from this sibling workspace
    # member — never a [project.dependencies] entry, so it plays no part in
    # `pip install --no-deps ./hindsight-homelab` at image build time. Without
    # it, `ty` cannot see the `hindsight_api` types this package imports.
    "hindsight-api-slim",
]

[tool.uv.sources]
hindsight-api-slim = { path = "../hindsight-api-slim" }
